<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/admin-favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/admin-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/admin-apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/admin-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/admin-icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MM Admin" />
    <meta name="application-name" content="My Money Manager Admin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="My Money Manager Admin Console by HackifyPro — dedicated administrator login, user directory, security center, and live push alerts." />
    <meta property="og:title" content="My Money Manager Admin — HackifyPro" />
    <meta property="og:description" content="Dedicated administrative portal for My Money Manager." />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/myadmin-manifest.json" />
    <title>My Money Manager Admin — HackifyPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('my_money_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen transition-colors duration-200">
    <div id="admin-root"></div>
    <script type="module" src="/src/myadmin-main.tsx"></script>
  </body>
</html>
