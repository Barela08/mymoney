<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · My Money Manager Admin</title>
    <link rel="icon" type="image/png" href="/admin-favicon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(circle at top, #0f172a 0%, #020617 70%);
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(16, 185, 129, 0.25);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
      }
      .logo {
        width: 68px;
        height: 68px;
        border-radius: 18px;
        object-fit: cover;
        border: 1px solid rgba(56, 189, 248, 0.35);
        margin: 0 auto 16px;
        display: block;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 8px;
        background: rgba(16, 185, 129, 0.14);
        border: 1px solid rgba(16, 185, 129, 0.35);
        color: #34d399;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 800;
        color: #ffffff;
      }
      p {
        margin: 0 0 22px;
        font-size: 13px;
        line-height: 1.6;
        color: #94a3b8;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 700;
        color: #020617;
        background: linear-gradient(135deg, #34d399, #22d3ee);
        cursor: pointer;
      }
      button:active {
        transform: scale(0.99);
      }
      .footer {
        margin-top: 18px;
        font-size: 11px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/admin-logo.png" alt="My Money Manager Admin" class="logo" />
      <div class="badge">Admin Console Offline</div>
      <h1>Connection Unavailable</h1>
      <p>
        My Money Manager Admin requires an active internet connection to sync live user data, support tickets, and security alerts.
      </p>
      <button type="button" onclick="window.location.href='/admin'">Retry Admin Connection</button>
      <div class="footer">My Money Manager Admin · HackifyPro</div>
    </main>
  </body>
</html>
