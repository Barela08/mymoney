<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — My Money Manager Staff</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #0f172a;
        border: 1px solid #312e81;
        border-radius: 24px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 16px;
        border: 1px solid rgba(99, 102, 241, 0.4);
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #94a3b8;
        margin: 0 0 24px;
      }
      button {
        background: #4f46e5;
        color: #ffffff;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/staff-icon-192.png" alt="My Money Manager Staff" />
      <h1>Staff Desk is Offline</h1>
      <p>
        You appear to have lost your network connection. Reconnect to continue working in
        <strong>My Money Manager Staff</strong> by HackifyPro.
      </p>
      <button onclick="window.location.href='/mystaff'">Retry Connection</button>
    </div>
  </body>
</html>
