<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <title>Offline · My Money Manager</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        object-fit: cover;
        margin-bottom: 16px;
        border: 2px solid rgba(16, 185, 129, 0.45);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #cbd5e1;
        margin: 0 0 20px;
      }
      button {
        background: #059669;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 11px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        background: #047857;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icon-192.png" alt="My Money Manager" />
      <h1>You are currently offline</h1>
      <p>
        My Money Manager could not reach the network right now. Reconnect to sync your latest
        transactions, budgets, and push notifications.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
